<ion-content class="subjects-content">
  <div class="subjects-container">
    <!-- Lista de Materias -->
    <div class="subject-list">
      <ion-card class="subject-card" *ngFor="let subject of subjects">
        <ion-card-header>
          <ion-card-title>{{ subject.name }}</ion-card-title>
          <ion-card-subtitle>{{ subject.credits }} Créditos</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content>
          <div class="schedule-chips">
            <ion-chip *ngFor="let item of subject.schedule" color="primary">
              {{ item.day }} - {{ item.time }}
            </ion-chip>
          </div>

          <div class="subject-actions">
            <ion-button fill="clear" (click)="editSubject(subject)">
              <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button
              fill="clear"
              color="danger"
              (click)="deleteSubject(subject)"
            >
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </ion-card-content>
      </ion-card>

      <!-- Mensaje cuando no hay materias -->
      <div class="empty-state" *ngIf="subjects.length === 0">
        <ion-icon name="book-outline"></ion-icon>
        <p>No tienes materias registradas</p>
      </div>
    </div>
  </div>

  <!-- Botón flotante para agregar con el evento click -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="custom-fab" (click)="addSubject()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<!-- Modal actualizado sin título en la navbar -->
<ion-modal
  [isOpen]="showModal"
  [breakpoints]="[0, 1.0]"
  [initialBreakpoint]="1.0"
  class="subject-modal"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="dismissModal()" class="modal-button">
            <ion-icon name="close-outline" class="modal-icon"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
          <ion-button
            (click)="saveSubject()"
            class="modal-button save-button"
            [disabled]="!subjectForm.valid"
          >
            {{ isEditing ? 'Actualizar' : 'Crear' }}
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="modal-content">
      <form [formGroup]="subjectForm">
        <div class="form-container">
          <div class="input-group">
            <div class="name-input-container">
              <ion-input
                class="name-input"
                formControlName="name"
                placeholder="Nombre de materia"
                autofocus="true"
                type="text"
              ></ion-input>
            </div>

            <ion-item class="custom-input">
              <ion-label position="floating">Créditos</ion-label>
              <ion-input
                type="number"
                formControlName="credits"
                placeholder="Ej: 4"
              ></ion-input>
            </ion-item>

            <div class="schedule-selector">
              <ion-label>Horarios de clase</ion-label>

              <div class="schedule-items">
                <div
                  *ngFor="let item of selectedScheduleItems; let i = index"
                  class="schedule-item"
                >
                  <ion-select
                    [value]="item.day"
                    (ionChange)="updateScheduleDay(i, $event.detail.value)"
                    placeholder="Día"
                    interface="popover"
                    class="day-select"
                  >
                    <ion-select-option
                      *ngFor="let day of availableDays"
                      [value]="day.value"
                    >
                      {{ day.value }}
                    </ion-select-option>
                  </ion-select>

                  <ion-select
                    [value]="item.time"
                    (ionChange)="updateScheduleTime(i, $event.detail.value)"
                    placeholder="Hora"
                    interface="popover"
                    class="time-select"
                  >
                    <ion-select-option
                      *ngFor="let time of availableTimes"
                      [value]="time"
                    >
                      {{ time }}
                    </ion-select-option>
                  </ion-select>

                  <ion-button
                    fill="clear"
                    color="danger"
                    (click)="removeScheduleItem(i)"
                  >
                    <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                  </ion-button>
                </div>
              </div>

              <ion-button
                expand="block"
                (click)="addScheduleItem()"
                class="add-schedule-btn"
              >
                <ion-icon name="add-outline" slot="start"></ion-icon>
                Agregar horario
              </ion-button>
            </div>
          </div>
        </div>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
