<ion-content class="register-content">
  <div class="register-container">
    <div class="register-card">
      <!-- Logo y título -->
      <div class="logo-container">
        <img src="assets/icon/logo.png" alt="Logo" class="logo" />
        <h1>Crear Cuenta</h1>
        <p class="subtitle">Regístrate para comenzar</p>
      </div>

      <!-- Formulario -->
      <div class="form-container">
        <ion-item lines="none" class="custom-input">
          <ion-label position="stacked">
            <ion-icon name="person-outline"></ion-icon>
            Nombre de Usuario
          </ion-label>
          <ion-input
            [(ngModel)]="username"
            type="text"
            autocomplete="off"
            placeholder="Tu nombre de usuario"
          >
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-input">
          <ion-label position="stacked">
            <ion-icon name="mail-outline"></ion-icon>
            Email
          </ion-label>
          <ion-input
            [(ngModel)]="email"
            type="email"
            autocomplete="off"
            placeholder="tucorreo@ejemplo.com"
          >
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-input">
          <ion-label position="stacked">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Contraseña
          </ion-label>
          <ion-input
            [(ngModel)]="password"
            type="password"
            autocomplete="off"
            placeholder="Tu contraseña"
          >
          </ion-input>
        </ion-item>

        <ion-button expand="block" class="register-button" (click)="register()">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Crear Cuenta
        </ion-button>

        <div class="login-link">
          <p>¿Ya tienes una cuenta?</p>
          <ion-button fill="clear" class="login-button" routerLink="/login">
            Inicia sesión aquí
            <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
